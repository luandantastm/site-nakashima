# Publica o site no GitHub Pages.
# O número do WhatsApp não fica no repositório: vem do segredo WHATSAPP_NUMERO
# e só é colocado nos .html na hora do deploy.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site com o número do WhatsApp
        env:
          WHATSAPP_NUMERO: ${{ secrets.WHATSAPP_NUMERO }}
        run: |
          if [ -z "$WHATSAPP_NUMERO" ]; then
            echo "::error::Segredo WHATSAPP_NUMERO não configurado"; exit 1
          fi
          mkdir _site
          cp index.html _site/
          cp -r versao-tecnologica versao-classica _site/
          find _site -name '*.html' -exec sed -i "s/NUMERO_WHATSAPP/$WHATSAPP_NUMERO/g" {} +
          if grep -rl NUMERO_WHATSAPP _site; then
            echo "::error::Marcador não substituído"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
